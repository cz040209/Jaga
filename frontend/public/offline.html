<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fa" />
  <title>Offline · Jaga</title>
  <script>
    // Same theme choice as the app (Light by default).
    try {
      var t = localStorage.getItem("jaga.theme");
      if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.classList.add("dark");
    } catch (_) {}
  </script>
  <style>
    :root { --bg: #f6f8fa; --fg: #0f172a; --muted: #64748b; --card: rgba(255,255,255,.75); --border: rgba(255,255,255,.8); }
    .dark { --bg: #0b1120; --fg: #e6edf5; --muted: #94a3b8; --card: rgba(15,23,42,.6); --border: rgba(255,255,255,.07); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg); display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%; max-width: 360px; text-align: center; padding: 32px 24px;
      background: var(--card); border: 1px solid var(--border); border-radius: 32px;
      box-shadow: 0 20px 48px -12px rgba(15,23,42,.16); backdrop-filter: blur(20px);
    }
    .mark { width: 72px; height: 72px; animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.06); opacity: .85; } }
    h1 { font-size: 24px; margin: 20px 0 8px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    button {
      margin-top: 24px; width: 100%; height: 52px; border: 0; border-radius: 999px; cursor: pointer;
      font: 600 15px/1 inherit; color: #fff; background: linear-gradient(#14b8a6, #0d9488);
      box-shadow: 0 12px 32px -10px rgba(13,148,136,.55);
    }
    button:active { transform: scale(.97); }
    small { display: block; margin-top: 16px; color: var(--muted); font-size: 12.5px; }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="t" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5eead4"/><stop offset=".45" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e7490"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#t)"/>
      <path d="M24 9.5 12.5 13.8v8.4c0 7.3 4.8 13.6 11.5 16.1 6.7-2.5 11.5-8.8 11.5-16.1v-8.4L24 9.5Z" fill="#fff"/>
      <path d="M24 9.5v28.8c6.7-2.5 11.5-8.8 11.5-16.1v-8.4L24 9.5Z" fill="#99f6e4" fill-opacity=".55"/>
      <path d="M27.2 17.5v7.2a4.4 4.4 0 0 1-7.8 2.8" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round"/>
    </svg>
    <h1>You're offline</h1>
    <p>Jaga needs a connection to show your balance and move money safely. Your money is safe.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>We'll reconnect automatically when you're back online.</small>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
